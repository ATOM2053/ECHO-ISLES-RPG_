<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#101820"
    >

    <title>ECHO ISLES RPG</title>

    <!-- =================================
         STYLESHEETS
    ================================== -->

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/character.css">
    <link rel="stylesheet" href="css/world.css">

</head>

<body>

    <!-- =================================
         MAIN MENU
    ================================== -->

    <main id="main-menu">

        <h1>ECHO ISLES</h1>

        <p>Fantasy MMORPG Adventure</p>

        <button id="start-game">
            START GAME
        </button>

        <button id="create-character">
            CREATE CHARACTER
        </button>

        <button id="settings-button">
            SETTINGS
        </button>

        <button id="account-button">
            ACCOUNT
        </button>

    </main>

    <!-- =================================
         ACCOUNT PANEL
    ================================== -->

    <section id="account-panel" hidden>

        <h2>ACCOUNT</h2>

        <div id="account-forms">

            <form id="login-form">

                <h3>LOGIN</h3>

                <input
                    id="login-username"
                    type="text"
                    placeholder="Username or Email"
                    required
                >

                <input
                    id="login-password"
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    LOGIN
                </button>

            </form>

            <form id="register-form">

                <h3>REGISTER</h3>

                <input
                    id="register-username"
                    type="text"
                    placeholder="Username"
                    required
                >

                <input
                    id="register-email"
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    id="register-password"
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    REGISTER
                </button>

            </form>

        </div>

        <div id="account-profile" hidden>

            <h3>ACCOUNT PROFILE</h3>

            <p id="profile-username"></p>

            <p id="profile-email"></p>

            <button id="logout-button">
                LOGOUT
            </button>

        </div>

        <p id="account-message"></p>

        <button id="account-back">
            BACK
        </button>

    </section>

    <!-- =================================
         CHARACTER PANEL
    ================================== -->

    <section id="character-panel" hidden>

        <h2>CHARACTER SELECT</h2>

        <div id="character-list"></div>

        <p id="character-message"></p>

        <h3>CREATE CHARACTER</h3>

        <form id="character-form">

            <input
                id="character-name"
                type="text"
                placeholder="Character Name"
                minlength="3"
                maxlength="20"
                required
            >

            <select id="character-race" required>

                <option value="">Select Race</option>
                <option value="Human">Human</option>
                <option value="Elf">Elf</option>
                <option value="Dark Elf">Dark Elf</option>
                <option value="Dwarf">Dwarf</option>
                <option value="Beastkin">Beastkin</option>
                <option value="Dragonkin">Dragonkin</option>

            </select>

            <select id="character-gender" required>

                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>

            </select>

            <select id="character-job" required>

                <option value="Adventurer">Adventurer</option>
                <option value="Swordsman">Swordsman</option>
                <option value="Knight">Knight</option>
                <option value="Archer">Archer</option>
                <option value="Mage">Mage</option>
                <option value="Assassin">Assassin</option>
                <option value="Priest">Priest</option>

            </select>

            <button
                id="character-create-submit"
                type="submit"
            >
                CREATE CHARACTER
            </button>

        </form>

        <button id="character-back">
            BACK
        </button>

    </section>

    <!-- =================================
         GAME WORLD SCREEN
    ================================== -->

    <section id="game-screen" hidden>

        <!-- WORLD HEADER -->

        <header class="world-header">

            <div class="world-player-info">

                <strong id="world-player-name">
                    Player
                </strong>

                <span id="world-player-level">
                    Level 1
                </span>

                <span id="world-player-job">
                    Adventurer
                </span>

            </div>

            <!-- PLAYER STATUS -->

            <div class="world-status">

                <div class="world-status-row">

                    <span class="world-status-label">
                        HP
                    </span>

                    <div class="world-bar">

                        <div
                            id="world-hp-bar"
                            class="world-bar-fill"
                        ></div>

                    </div>

                    <span id="world-hp-text">
                        100/100
                    </span>

                </div>

                <div class="world-status-row">

                    <span class="world-status-label">
                        MP
                    </span>

                    <div class="world-bar">

                        <div
                            id="world-mp-bar"
                            class="world-bar-fill"
                        ></div>

                    </div>

                    <span id="world-mp-text">
                        100/100
                    </span>

                </div>

                <div class="world-bar">

                    <div
                        id="world-exp-bar"
                        class="world-bar-fill"
                    ></div>

                </div>

            </div>

            <button id="leave-world">
                LEAVE
            </button>

        </header>

        <!-- WORLD CONTENT -->

        <div class="world-content">

            <!-- MAP -->

            <main class="world-main">

                <div id="map-name">
                    Echo Isles - Starting Village
                </div>

                <canvas
                    id="game-canvas"
                    width="1280"
                    height="720"
                ></canvas>

            </main>

            <!-- GAME MENU -->

            <aside class="world-sidebar">

                <button id="inventory-button">
                    INVENTORY
                </button>

                <button id="equipment-button">
                    EQUIPMENT
                </button>

                <button id="skills-button">
                    SKILLS
                </button>

                <button id="quests-button">
                    QUESTS
                </button>

                <button id="professions-button">
                    PROFESSIONS
                </button>

                <button id="guild-button">
                    GUILD
                </button>

            </aside>

            <!-- CHAT -->

            <aside class="world-chat">

                <div class="world-chat-title">
                    WORLD CHAT
                </div>

                <div id="chat-messages"></div>

                <form id="chat-form">

                    <input
                        id="chat-input"
                        type="text"
                        maxlength="200"
                        placeholder="Write a message..."
                        autocomplete="off"
                        required
                    >

                    <button type="submit">
                        SEND
                    </button>

                </form>

            </aside>

        </div>

        <!-- WORLD FOOTER -->

        <footer class="world-footer">

            <span>
                ECHO ISLES MMORPG
            </span>

            <span id="world-player-count">
                Players Online: 0
            </span>

        </footer>

    </section>

    <!-- =================================
         SERVER STATUS
    ================================== -->

    <div id="server-status">
        Checking server...
    </div>

    <!-- =================================
         SOCKET.IO
    ================================== -->

    <script src="/socket.io/socket.io.js"></script>

    <!-- =================================
         GAME CONFIGURATION
    ================================== -->

    <script src="js/config.js"></script>

    <!-- =================================
         GAME SYSTEMS
    ================================== -->

    <script src="js/auth.js"></script>

    <script src="js/characters.js"></script>

    <script src="js/main.js"></script>

    <script src="js/character-ui.js"></script>

    <!-- =================================
         UI CONTROLLER
    ================================== -->

    <script>

    "use strict";

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            const $ = id =>
                document.getElementById(id);

            /* =================================
               MAIN MENU
            ================================== */

            $("start-game").addEventListener(
                "click",
                () => {

                    if (!window.ECHO_AUTH.isLoggedIn()) {

                        $("account-panel").hidden = false;

                        $("main-menu").hidden = true;

                        return;

                    }

                    window.ECHO_CHARACTER_UI.open();

                }
            );

            $("create-character").addEventListener(
                "click",
                () => {

                    if (!window.ECHO_AUTH.isLoggedIn()) {

                        $("account-panel").hidden = false;

                        $("main-menu").hidden = true;

                        return;

                    }

                    window.ECHO_CHARACTER_UI.open();

                }
            );

            $("account-button").addEventListener(
                "click",
                () => {

                    $("main-menu").hidden = true;

                    $("account-panel").hidden = false;

                }
            );

            $("account-back").addEventListener(
                "click",
                () => {

                    $("account-panel").hidden = true;

                    $("main-menu").hidden = false;

                }
            );

            /* =================================
               ACCOUNT LOGIN
            ================================== */

            $("login-form").addEventListener(
                "submit",
                async event => {

                    event.preventDefault();

                    try {

                        await window.ECHO_AUTH.login(
                            $("login-username").value,
                            $("login-password").value
                        );

                        $("account-message").textContent =
                            "Login successful!";

                        $("login-form").reset();

                    } catch (error) {

                        $("account-message").textContent =
                            error.message;

                    }

                }
            );

            /* =================================
               ACCOUNT REGISTER
            ================================== */

            $("register-form").addEventListener(
                "submit",
                async event => {

                    event.preventDefault();

                    try {

                        await window.ECHO_AUTH.register({

                            username:
                                $("register-username").value,

                            email:
                                $("register-email").value,

                            password:
                                $("register-password").value

                        });

                        $("account-message").textContent =
                            "Registration successful!";

                        $("register-form").reset();

                    } catch (error) {

                        $("account-message").textContent =
                            error.message;

                    }

                }
            );

            /* =================================
               LOGOUT
            ================================== */

            $("logout-button").addEventListener(
                "click",
                () => {

                    window.ECHO_AUTH.logout();

                    $("account-profile").hidden = true;

                    $("account-forms").hidden = false;

                    $("account-message").textContent =
                        "Logged out.";

                }
            );

            /* =================================
               ENTER WORLD EVENT
            ================================== */

            document.addEventListener(
                "echo:world-entered",
                event => {

                    const player =
                        event.detail?.player ||
                        window.ECHO_GAME.player;

                    if (!player) return;

                    $("main-menu").hidden = true;

                    $("account-panel").hidden = true;

                    $("character-panel").hidden = true;

                    $("game-screen").hidden = false;

                    $("world-player-name").textContent =
                        player.name || "Player";

                    $("world-player-level").textContent =
                        "Level " + (player.level || 1);

                    $("world-player-job").textContent =
                        player.job || "Adventurer";

                    $("world-hp-text").textContent =
                        (player.hp || 0) + "/100";

                    $("world-mp-text").textContent =
                        (player.mp || 0) + "/100";

                    $("world-hp-bar").style.width =
                        Math.min(100, player.hp || 0) + "%";

                    $("world-mp-bar").style.width =
                        Math.min(100, player.mp || 0) + "%";

                    $("map-name").textContent =
                        player.map || "Echo Isles";

                }
            );

            /* =================================
               CHAT
            ================================== */

            $("chat-form").addEventListener(
                "submit",
                event => {

                    event.preventDefault();

                    const message =
                        $("chat-input").value.trim();

                    if (!message) return;

                    const socket =
                        window.ECHO_GAME?.network?.socket;

                    if (!socket || !socket.connected) {

                        return;

                    }

                    socket.emit("chat:send", {
                        message
                    });

                    $("chat-input").value = "";

                }
            );

            /* =================================
               GAME MENU BUTTONS
            ================================== */

            [
                "inventory-button",
                "equipment-button",
                "skills-button",
                "quests-button",
                "professions-button",
                "guild-button"
            ].forEach(id => {

                $(id).addEventListener(
                    "click",
                    () => {

                        alert(
                            "This feature is under development."
                        );

                    }
                );

            });

            /* =================================
               LEAVE WORLD
            ================================== */

            $("leave-world").addEventListener(
                "click",
                () => {

                    if (window.ECHO_GAME?.network?.socket) {

                        window.ECHO_GAME.network.socket.disconnect();

                        window.ECHO_GAME.network.socket = null;

                    }

                    $("game-screen").hidden = true;

                    $("main-menu").hidden = false;

                }
            );

        }
    );

    </script>

</body>

                                </html>
