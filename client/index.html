<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#101522">

    <title>ECHO ISLES RPG</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Game UI CSS -->
    <link rel="stylesheet" href="css/ui.css">

</head>

<body>

    <div class="background"></div>
    <div class="stars"></div>

    <main class="main-menu">

        <div class="menu-container">

            <div class="game-logo">

                <h1>ECHO ISLES</h1>

                <p>THE WORLD OF ADVENTURE</p>

                <div class="divider"></div>

            </div>

            <p class="menu-subtitle">
                โลกแห่งการผจญภัยกำลังรอคุณอยู่
            </p>

            <div class="menu-buttons">

                <button class="menu-btn primary" id="startButton">
                    เริ่มการผจญภัย
                </button>

                <button class="menu-btn" id="characterButton">
                    สร้างตัวละคร
                </button>

                <button class="menu-btn" id="settingsButton">
                    ตั้งค่า
                </button>

            </div>

            <div class="server-status">

                <span class="status-dot" id="statusDot"></span>

                <span id="serverStatus">
                    กำลังเชื่อมต่อเซิร์ฟเวอร์...
                </span>

            </div>

            <div class="footer">
                ECHO ISLES RPG © 2026
                <br>
                ONLINE MMORPG · VERSION 0.1.0
            </div>

        </div>

    </main>

    <div class="notification" id="notification"></div>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <script>

        const statusDot =
            document.getElementById("statusDot");

        const serverStatus =
            document.getElementById("serverStatus");

        const notification =
            document.getElementById("notification");

        let socket = null;
        let playerData = null;

        // Notification

        function showNotification(message) {

            notification.textContent = message;

            notification.classList.add("show");

            setTimeout(() => {

                notification.classList.remove("show");

            }, 2500);

        }

        // Server Status

        function updateServerStatus(status, text) {

            statusDot.className = "status-dot " + status;

            serverStatus.textContent = text;

        }

        // Socket.IO Connection

        if (typeof io !== "undefined") {

            socket = io({

                reconnection: true,

                reconnectionAttempts: Infinity,

                reconnectionDelay: 2000

            });

            socket.on("connect", () => {

                updateServerStatus(
                    "online",
                    "เซิร์ฟเวอร์ออนไลน์"
                );

                showNotification(
                    "เชื่อมต่อเซิร์ฟเวอร์สำเร็จ!"
                );

                console.log("Connected:", socket.id);

            });

            socket.on("disconnect", () => {

                updateServerStatus(
                    "offline",
                    "ขาดการเชื่อมต่อ"
                );

            });

            socket.on("connect_error", (error) => {

                updateServerStatus(
                    "offline",
                    "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้"
                );

                console.error(error);

            });

            socket.on("world:init", (data) => {

                playerData = data.self;

                console.log("Player Data:", playerData);

                console.log("World Players:", data.players);

            });

            socket.on("player:joined", (player) => {

                console.log("Player joined:", player);

            });

            socket.on("player:left", (playerId) => {

                console.log("Player left:", playerId);

            });

        } else {

            updateServerStatus(
                "offline",
                "ไม่พบระบบ Socket.IO"
            );

        }

        // Start Game

        document
            .getElementById("startButton")
            .addEventListener("click", () => {

                if (!socket || !socket.connected) {

                    showNotification(
                        "กรุณารอการเชื่อมต่อเซิร์ฟเวอร์"
                    );

                    return;

                }

                showNotification(
                    "ระบบสร้างตัวละครกำลังพัฒนา"
                );

            });

        // Character Creator

        document
            .getElementById("characterButton")
            .addEventListener("click", () => {

                showNotification(
                    "Character Creator กำลังพัฒนา"
                );

            });

        // Settings

        document
            .getElementById("settingsButton")
            .addEventListener("click", () => {

                showNotification(
                    "Settings กำลังพัฒนา"
                );

            });

    </script>

</body>

</html>
