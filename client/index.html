<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10131e">

    <title>ECHO ISLES RPG</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/character.css">
</head>

<body>

    <div class="background">
        <div class="stars"></div>
    </div>

    <main class="main-menu">

        <div class="logo-container">
            <h1 class="logo">ECHO <span>ISLES</span></h1>
            <p class="subtitle">THE WORLD OF ADVENTURE</p>
            <div class="divider"></div>
            <p class="game-description">
                Explore the world. Create your destiny.
            </p>
        </div>

        <!-- MAIN MENU -->
        <div class="menu-buttons" id="main-menu">

            <button class="menu-button primary" id="start-game">
                START GAME
            </button>

            <button class="menu-button" id="create-character">
                CREATE CHARACTER
            </button>

            <button class="menu-button" id="settings">
                SETTINGS
            </button>

            <button class="menu-button" id="account-button">
                ACCOUNT
            </button>

        </div>

        <!-- ACCOUNT PANEL -->
        <section id="account-panel" hidden>

            <h2>PLAYER ACCOUNT</h2>

            <div id="auth-forms">

                <div id="login-form">

                    <h3>LOGIN</h3>

                    <input
                        type="text"
                        id="login-identifier"
                        placeholder="Username or Email"
                        autocomplete="username"
                    >

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Password"
                        autocomplete="current-password"
                    >

                    <button class="menu-button primary" id="login-submit">
                        LOGIN
                    </button>

                </div>

                <div id="register-form">

                    <h3>REGISTER</h3>

                    <input
                        type="text"
                        id="register-username"
                        placeholder="Username"
                        autocomplete="username"
                    >

                    <input
                        type="email"
                        id="register-email"
                        placeholder="Email"
                        autocomplete="email"
                    >

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Password (8-128 characters)"
                        autocomplete="new-password"
                    >

                    <button class="menu-button primary" id="register-submit">
                        CREATE ACCOUNT
                    </button>

                </div>

            </div>

            <div id="account-profile" hidden>

                <h3>ACCOUNT INFORMATION</h3>

                <p id="account-username"></p>
                <p id="account-email"></p>

                <button class="menu-button" id="logout-button">
                    LOGOUT
                </button>

            </div>

            <button class="menu-button" id="back-menu">
                BACK TO MENU
            </button>

        </section>

        <!-- CHARACTER PANEL -->
        <section id="character-panel" class="character-panel" hidden>

            <h2>CHARACTER SELECTION</h2>

            <p id="character-message" class="character-message"></p>

            <div id="character-list" class="character-list"></div>

            <div class="divider"></div>

            <h3>CREATE NEW CHARACTER</h3>

            <form id="character-form" class="character-form">

                <!-- CHARACTER NAME -->
                <input
                    type="text"
                    id="character-name"
                    placeholder="Character Name"
                    minlength="3"
                    maxlength="20"
                    required
                >

                <!-- CHARACTER RACE -->
                <select id="character-race" required>

                    <option value="">Select Race</option>

                    <option value="Human">Human</option>
                    <option value="Elf">Elf</option>
                    <option value="Dark Elf">Dark Elf</option>
                    <option value="Dwarf">Dwarf</option>
                    <option value="Beastkin">Beastkin</option>
                    <option value="Dragonkin">Dragonkin</option>

                </select>

                <!-- CHARACTER GENDER -->
                <select id="character-gender" required>

                    <option value="">Select Gender</option>

                    <option value="Male">Male</option>
                    <option value="Female">Female</option>

                </select>

                <!-- CHARACTER JOB -->
                <select id="character-job" required>

                    <option value="">Select Job</option>

                    <option value="Adventurer">Adventurer</option>
                    <option value="Swordsman">Swordsman</option>
                    <option value="Knight">Knight</option>
                    <option value="Archer">Archer</option>
                    <option value="Mage">Mage</option>
                    <option value="Assassin">Assassin</option>
                    <option value="Priest">Priest</option>

                </select>

                <button
                    type="submit"
                    id="character-create-submit"
                    class="character-action"
                >
                    CREATE CHARACTER
                </button>

            </form>

            <button
                type="button"
                id="character-back"
                class="character-secondary"
            >
                BACK TO MENU
            </button>

        </section>

        <!-- SERVER STATUS -->
        <div class="server-status">

            <span class="status-indicator" id="status-indicator"></span>

            <span id="server-status">
                CONNECTING TO SERVER...
            </span>

        </div>

        <footer class="footer">
            <p>ECHO ISLES RPG</p>
            <p>VERSION 0.1.0</p>
        </footer>

    </main>

    <div id="notification" class="notification">
        Welcome to ECHO ISLES!
    </div>

    <!-- GAME SCRIPTS -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/main.js"></script>
    <script src="js/character-ui.js"></script>

    <script>

        document.addEventListener("DOMContentLoaded", async () => {

            const $ = id => document.getElementById(id);

            const mainMenu = $("main-menu");
            const accountPanel = $("account-panel");
            const characterPanel = $("character-panel");

            const authForms = $("auth-forms");
            const accountProfile = $("account-profile");

            const notification = $("notification");

            function showNotification(message) {

                notification.textContent = message;
                notification.classList.add("show");

                setTimeout(() => {
                    notification.classList.remove("show");
                }, 3000);

            }

            function showAccountPanel() {

                mainMenu.hidden = true;
                characterPanel.hidden = true;
                accountPanel.hidden = false;

            }

            function showMainMenu() {

                accountPanel.hidden = true;
                characterPanel.hidden = true;
                mainMenu.hidden = false;

            }

            async function updateAccountDisplay() {

                const account = await window.ECHO_AUTH.getProfile();

                if (account) {

                    authForms.hidden = true;
                    accountProfile.hidden = false;

                    $("account-username").textContent =
                        "Username: " + account.username;

                    $("account-email").textContent =
                        "Email: " + account.email;

                } else {

                    authForms.hidden = false;
                    accountProfile.hidden = true;

                }

            }

            // SERVER CONNECTION

            if (window.ECHO_GAME) {

                window.ECHO_GAME.network.connect();

                const socket = window.ECHO_GAME.network.socket;

                socket.on("connect", () => {

                    $("server-status").textContent = "SERVER ONLINE";
                    $("status-indicator").classList.add("online");

                });

                socket.on("disconnect", () => {

                    $("server-status").textContent = "SERVER OFFLINE";
                    $("status-indicator").classList.remove("online");

                });

                socket.on("connect_error", () => {

                    $("server-status").textContent = "CONNECTION FAILED";
                    $("status-indicator").classList.remove("online");

                });

            } else {

                $("server-status").textContent = "GAME SYSTEM ERROR";

            }

            // ACCOUNT

            $("account-button").addEventListener("click", async () => {

                showAccountPanel();
                await updateAccountDisplay();

            });

            // LOGIN

            $("login-submit").addEventListener("click", async () => {

                const identifier = $("login-identifier").value.trim();
                const password = $("login-password").value;

                if (!identifier || !password) {
                    showNotification("กรุณากรอกข้อมูลให้ครบ");
                    return;
                }

                try {

                    await window.ECHO_AUTH.login(identifier, password);

                    await updateAccountDisplay();

                    showNotification("เข้าสู่ระบบสำเร็จ!");

                } catch (error) {

                    showNotification(error.message);

                }

            });

            // REGISTER

            $("register-submit").addEventListener("click", async () => {

                const username = $("register-username").value.trim();
                const email = $("register-email").value.trim();
                const password = $("register-password").value;

                if (!username || !email || !password) {
                    showNotification("กรุณากรอกข้อมูลให้ครบ");
                    return;
                }

                try {

                    await window.ECHO_AUTH.register(
                        username,
                        email,
                        password
                    );

                    showNotification("สมัครสมาชิกสำเร็จ กรุณาเข้าสู่ระบบ");

                    $("login-identifier").value = username;
                    $("login-password").value = "";

                } catch (error) {

                    showNotification(error.message);

                }

            });

            // LOGOUT

            $("logout-button").addEventListener("click", () => {

                window.ECHO_AUTH.logout();

                updateAccountDisplay();

                showNotification("ออกจากระบบแล้ว");

            });

            // BACK TO MENU

            $("back-menu").addEventListener("click", showMainMenu);

            // CHARACTER CREATOR

            $("create-character").addEventListener("click", async () => {

                const account = await window.ECHO_AUTH.getProfile();

                if (!account) {

                    showNotification("กรุณาเข้าสู่ระบบก่อน");

                    showAccountPanel();

                    return;

                }

                window.ECHO_CHARACTER_UI.open();

            });

            // START GAME

            $("start-game").addEventListener("click", async () => {

                const account = await window.ECHO_AUTH.getProfile();

                if (!account) {

                    showNotification("กรุณาเข้าสู่ระบบก่อน");

                    showAccountPanel();

                    return;

                }

                showNotification("เตรียมเข้าสู่โลก ECHO ISLES...");

                window.ECHO_CHARACTER_UI.open();

            });

            // SETTINGS

            $("settings").addEventListener("click", () => {

                showNotification("Settings coming soon!");

            });

            // CHARACTER BACK

            $("character-back").addEventListener("click", () => {

                showMainMenu();

            });

        });

    </script>

</body>
</html>
