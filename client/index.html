<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#10131e">

    <title>ECHO ISLES RPG</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Game CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">

</head>

<body>

    <!-- Background -->
    <div class="background">
        <div class="stars"></div>
    </div>

    <!-- Main Menu -->
    <main class="main-menu">

        <!-- Logo -->
        <div class="logo-container">

            <h1 class="logo">
                ECHO <span>ISLES</span>
            </h1>

            <p class="subtitle">
                THE WORLD OF ADVENTURE
            </p>

            <div class="divider"></div>

            <p class="game-description">
                Explore the world. Create your destiny.
            </p>

        </div>

        <!-- Menu Buttons -->
        <div class="menu-buttons">

            <button
                class="menu-button primary"
                id="start-game"
                type="button"
            >
                START GAME
            </button>

            <button
                class="menu-button"
                id="create-character"
                type="button"
            >
                CREATE CHARACTER
            </button>

            <button
                class="menu-button"
                id="settings"
                type="button"
            >
                SETTINGS
            </button>

        </div>

        <!-- Server Status -->
        <div class="server-status">

            <span class="status-indicator" id="status-indicator"></span>

            <span id="server-status">
                CONNECTING TO SERVER...
            </span>

        </div>

        <!-- Footer -->
        <footer class="footer">

            <p>
                ECHO ISLES RPG
            </p>

            <p>
                VERSION 0.1.0
            </p>

        </footer>

    </main>

    <!-- Notification -->
    <div id="notification" class="notification">
        Welcome to ECHO ISLES!
    </div>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Game Configuration -->
    <script src="js/config.js"></script>

    <!-- Main Game Controller -->
    <script src="js/main.js"></script>

    <!-- Main Menu Controller -->
    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const startButton = document.getElementById("start-game");
            const characterButton = document.getElementById("create-character");
            const settingsButton = document.getElementById("settings");

            const statusText = document.getElementById("server-status");
            const statusIndicator = document.getElementById("status-indicator");
            const notification = document.getElementById("notification");

            // Notification
            function showNotification(message) {

                notification.textContent = message;

                notification.classList.add("show");

                setTimeout(() => {
                    notification.classList.remove("show");
                }, 3000);

            }

            // Connect to server
            if (window.ECHO_GAME) {

                window.ECHO_GAME.network.connect();

                const socket = window.ECHO_GAME.network.socket;

                socket.on("connect", () => {

                    statusText.textContent = "SERVER ONLINE";

                    statusIndicator.classList.add("online");

                });

                socket.on("disconnect", () => {

                    statusText.textContent = "SERVER OFFLINE";

                    statusIndicator.classList.remove("online");

                });

                socket.on("connect_error", () => {

                    statusText.textContent = "CONNECTION FAILED";

                    statusIndicator.classList.remove("online");

                });

            } else {

                statusText.textContent = "GAME SYSTEM ERROR";

            }

            // Start Game
            startButton.addEventListener("click", () => {

                if (!window.ECHO_GAME?.state.connected) {

                    showNotification("Unable to connect to game server.");

                    return;

                }

                showNotification("Game world is being prepared.");

            });

            // Character Creator
            characterButton.addEventListener("click", () => {

                showNotification("Character Creator is coming soon!");

            });

            // Settings
            settingsButton.addEventListener("click", () => {

                showNotification("Settings are coming soon!");

            });

        });

    </script>

</body>
</html>
